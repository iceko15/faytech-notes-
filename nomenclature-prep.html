       let currentIndex = 0;
       let subIndex = 0;
       const cardEl = document.getElementById('flashcard');
       const containerEl = document.getElementById('cardContainer');
       const frontTextEl = document.getElementById('frontText');
       const backTextEl = document.getElementById('backText');
       const frontImgEl = document.getElementById('frontImage');
       const backImgEl = document.getElementById('backImage');
       const counterEl = document.getElementById('counter');

       function shuffleDeck() {
           // Fisher-Yates Shuffle Algorithm to randomize the array
           for (let i = cardDeck.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [cardDeck[i], cardDeck[j]] = [cardDeck[j], cardDeck[i]];
           }
           currentIndex = 0; // Reset to the first card of the new shuffled deck
           updateCard();
       }

       function updateCard() {
           const card = cardDeck[currentIndex];
           
           // Handle text
           frontTextEl.innerText = card.frontText;
           backTextEl.innerText = card.backText;

           // Handle front image
           if (card.frontImg) {
               frontImgEl.src = card.frontImg;
               frontImgEl.style.display = 'block';
           } else {
               frontImgEl.style.display = 'none';
           }

           // Handle back image
           if (card.backImg) {
               backImgEl.src = card.backImg;
               backImgEl.style.display = 'block';
           } else {
               backImgEl.style.display = 'none';
           }

           const subLabel = hasIdent ? ` [Item ${subIndex + 1}/${card.identifications.length}]` : '';
           counterEl.innerText = `${currentIndex + 1} / ${cardDeck.length}${subLabel}`;
           
           cardEl.classList.remove('is-flipped');
       }

       function nextCard() {
           const card = cardDeck[currentIndex];
           if (card.identifications && subIndex < card.identifications.length - 1) {
               subIndex++;
           } else {
               currentIndex = (currentIndex + 1) % cardDeck.length;
               subIndex = 0;
           }
           updateCard();
       }

       function prevCard() {
           const card = cardDeck[currentIndex];
           if (card.identifications && subIndex > 0) {
               subIndex--;
           } else {
               currentIndex = (currentIndex - 1 + cardDeck.length) % cardDeck.length;
               const newCard = cardDeck[currentIndex];
               subIndex = (newCard.identifications) ? newCard.identifications.length - 1 : 0;
           }
           updateCard();
       }

       // Toggle flip on click
       cardEl.addEventListener('click', () => {
           cardEl.classList.toggle('is-flipped');
       });

       // Initial render
       updateCard();
